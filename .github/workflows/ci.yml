name: Employee Management CI

on:
  push:
    branches:
      - main

permissions:
    id-token: write
    contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Node Version
        run: |
          node -v
          npm -v
      - name: Install frontend Dependencies
        working-directory: app/frontend
        run: npm install
      
      - name: Build Frontend
        working-directory: app/frontend
        run: npm run build

      - name: Zip build
        working-directory: app/frontend
        run: zip -r ../../frontend.zip dist
        

      - name: Verify ZIP
        run: |
         pwd
         ls -lh
                
      - name: Debug GitHub Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
      
      - name: Dump OIDC claims
        uses: actions/github-script@v7
        with:
         script: |
          const token = await core.getIDToken();
          const payload = JSON.parse(
            Buffer.from(token.split('.')[1], 'base64').toString()
          );

          console.log("SUB:", payload.sub);
          console.log("AUD:", payload.aud);
          console.log("REPOSITORY:", payload.repository);
          console.log("REF:", payload.ref);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload to S3
        run: |
         aws s3 cp frontend.zip s3://employeeapplicationdst/frontend.zip
                  
      - name: Deploy frontend to ASG instances
        run: |
          aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --targets "Key=tag:Name,Values=frontend-asg" \
          --parameters commands='[
          "aws s3 cp s3://employeeapplicationdst/frontend.zip /tmp/frontend.zip",
          "rm -rf /tmp/frontend",
          "mkdir -p /tmp/frontend",
          "unzip -o /tmp/frontend.zip -d /tmp/frontend",
          "sudo rm -rf /usr/share/nginx/html/*",
          "sudo cp -r /tmp/frontend/dist/* /usr/share/nginx/html/",
          "sudo systemctl restart nginx"]'